<!DOCTYPE html>
<html>
  <head>
    <title>sneezerupees</title>
    <link href="https://fonts.googleapis.com/css2?family=Space+Mono&display=swap" rel="stylesheet">
    <style>
      body {
  font-family: 'Space Mono', monospace;
  text-align: center;
  color: white;
  padding-top: 80px;
  background-image: url('bladee_king.gif');
  background-size: cover;
  background-position: center;
  background-repeat: no-repeat;
  background-attachment: fixed;
}

      h1 {
        font-size: 2.5em;
      }

      p {
        color: #aaa;
      }

      .links {
        margin-top: 40px;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 15px;
      }

      .links a {
        text-decoration: none;
        color: white;
        background-color: #222;
        border: 1px solid #444;
        padding: 12px 40px;
        border-radius: 8px;
        width: 300px;
        transition: background 0.2s;
      }

      .links a:hover {
        background-color: #333;
      }
    </style>
  </head>
  <body>
    <h1>hi im Novacainine aka sneezerupees</h1>
    <p>all my links</p>

    <div class="links">
      <a href="https://www.youtube.com/@Nl0u3">youtube</a>
      <a href="https://www.roblox.com/users/996670128/profile" target="_blank">roblox account</a>
    </div>

    <p style="color: #aaa; margin-top: 30px; font-size: 0.9em;">👁 <span id="views">...</span></p>

    <script>
      fetch('https://api.countapi.xyz/hit/sneezerupees.github.io/visits')
        .then(res => res.json())
        .then(data => {
          document.getElementById('views').textContent = data.value;
        });

      document.addEventListener('click', function(e) {
        const emojis = ['✨', '🐈', '🐾', '⭐', '❤️', '👀'];
        const emoji = document.createElement('div');

        emoji.textContent = emojis[Math.floor(Math.random() * emojis.length)];
        emoji.style.position = 'fixed';
        emoji.style.left = e.clientX + 'px';
        emoji.style.top = e.clientY + 'px';
        emoji.style.fontSize = '2em';
        emoji.style.pointerEvents = 'none';
        emoji.style.transition = 'all 0.8s ease';
        emoji.style.zIndex = '9999';

        document.body.appendChild(emoji);

        setTimeout(() => {
          emoji.style.opacity = '0';
          emoji.style.transform = 'translateY(-60px)';
        }, 50);

        setTimeout(() => emoji.remove(), 900);
      });
    </script>

  </body>
</html>
